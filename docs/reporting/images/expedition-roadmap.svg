<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">Yendor roadmap: Now, next and the trail ahead</title><desc id="desc">Now: finish foundation verification; ten tests pass, CI smoke and human controls remain. Next: combat feel, with a two-minute arena fun without loot. Later in order: systemic roguelike, exploration, beauty. Milestones are gates, not dates.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern></defs>
<rect width="1200" height="770" rx="26" fill="#102e2b"/><rect width="1200" height="770" rx="26" fill="url(#grid)"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="40" y="51" fill="#e4c891" font-size="17" letter-spacing="3">YENDOR / EXPEDITION FIELD GUIDE</text>
<text x="40" y="105" fill="#f9f5e9" font-size="40" font-weight="700">The trail ahead</text>
<text x="40" y="143" fill="#c4d6cb" font-size="21">One compelling expedition, built one proven milestone at a time.</text>
<path d="M80 350H1120M80 605H1120" fill="none" stroke="#d5bc85" stroke-width="2" stroke-dasharray="5 8" opacity=".35"/>
<rect x="40" y="184" width="550" height="265" rx="18" fill="#f3e7c9" stroke="#e5bc69" stroke-width="2"/><text x="65" y="221" fill="#725421" font-size="18" font-weight="700" letter-spacing="2">01 / NOW</text><text x="65" y="266" fill="#173d33" font-size="34" font-weight="700">Foundation</text><text x="65" y="304" fill="#294b3e" font-size="23" font-weight="400">Make the greybox dependable.</text><rect x="65" y="326" width="218" height="33" rx="16" fill="#1b6752"/><text x="82" y="349" fill="#ffffff" font-size="17" font-weight="700">10 / 10 tests pass</text><text x="65" y="395" fill="#674d27" font-size="20" font-weight="700">Finish: CI smoke + human control pass</text><text x="65" y="425" fill="#4a5e47" font-size="18" font-weight="400">Controls · combat · hazards · objective · replay</text><rect x="610" y="184" width="550" height="265" rx="18" fill="#1a4b44" stroke="#58b6a5" stroke-width="2"/><text x="636" y="221" fill="#8cddc7" font-size="18" font-weight="700" letter-spacing="2">02 / NEXT</text><text x="636" y="266" fill="#ffffff" font-size="34" font-weight="700">Combat feel</text><text x="636" y="304" fill="#d4e8dc" font-size="23" font-weight="400">Make movement and fighting sing.</text><text x="636" y="350" fill="#d4e8dc" font-size="20" font-weight="400">Dash + aim + camera + hit feedback</text><text x="636" y="395" fill="#f3d89b" font-size="20" font-weight="700">Gate: a two-minute arena stays fun</text><text x="636" y="425" fill="#f3d89b" font-size="20" font-weight="700">even without loot.</text><text x="40" y="492" fill="#e4c891" font-size="17" font-weight="700" letter-spacing="2">LATER / IN ORDER</text><rect x="40" y="520" width="360" height="184" rx="18" fill="#173b36" stroke="#3e6152" stroke-width="2"/><text x="62" y="553" fill="#7fc8bc" font-size="19" font-weight="700">03</text><text x="62" y="588" fill="#fbf5e6" font-size="25" font-weight="700">Systemic roguelike</text><text x="62" y="620" fill="#c5d8cc" font-size="17" font-weight="400">Discover rules. Shape a build.</text><text x="62" y="658" fill="#7fc8bc" font-size="18" font-weight="400">Two distinct loadouts</text><text x="62" y="685" fill="#7fc8bc" font-size="18" font-weight="400">Replay restores drops</text><rect x="420" y="520" width="360" height="184" rx="18" fill="#173b36" stroke="#3e6152" stroke-width="2"/><text x="442" y="553" fill="#b7c98a" font-size="19" font-weight="700">04</text><text x="442" y="588" fill="#fbf5e6" font-size="25" font-weight="700">Exploration</text><text x="442" y="620" fill="#c5d8cc" font-size="17" font-weight="400">Take the interesting route.</text><text x="442" y="658" fill="#b7c98a" font-size="18" font-weight="400">Legible destinations</text><text x="442" y="685" fill="#b7c98a" font-size="18" font-weight="400">Detours reward curiosity</text><rect x="800" y="520" width="360" height="184" rx="18" fill="#173b36" stroke="#3e6152" stroke-width="2"/><text x="822" y="553" fill="#e4b184" font-size="19" font-weight="700">05</text><text x="822" y="588" fill="#fbf5e6" font-size="25" font-weight="700">Beauty</text><text x="822" y="620" fill="#c5d8cc" font-size="17" font-weight="400">Make the world worth seeing.</text><text x="822" y="658" fill="#e4b184" font-size="18" font-weight="400">Readable enemies + hazards</text><text x="822" y="685" fill="#e4b184" font-size="18" font-weight="400">60 fps at 1080p, measured</text><text x="40" y="744" fill="#a9c1b4" font-size="15" font-weight="700" letter-spacing="2">MILESTONES, NOT DATES</text><text x="694" y="744" fill="#cbdccf" font-size="17" font-weight="400">Current stage: foundation verification</text></g></svg>